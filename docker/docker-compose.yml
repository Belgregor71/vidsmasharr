# Synology Container Manager -> Project -> import this file.
#
# The render node's group id was confirmed on this NAS as 937:
#     $ stat -c '%g' /dev/dri/renderD128
#     937
# Without group_add the container can see /dev/dri but not open it, and every
# hardware encode fails. Re-check this if DSM is ever upgraded.

services:
  vidsmasharr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vidsmasharr:latest
    container_name: vidsmasharr

    devices:
      # QuickSync. Nothing hardware-accelerated works without this.
      - /dev/dri:/dev/dri
    group_add:
      # 937 = the render node's gid on this NAS, confirmed above.
      - "937"

    environment:
      # Apollo Lake is Gen9. iHD is the modern driver; if the capability report
      # shows VAAPI failing to initialise, try i965 here instead.
      - LIBVA_DRIVER_NAME=iHD
      - TZ=${TZ:-Australia/Sydney}
      - VIDSMASHARR_CONFIG_DIR=/config

    volumes:
      # ../ because compose resolves relative paths against THIS file's
      # directory, not your working directory. This file lives in docker/, so
      # ./config would mean docker/config -- which does not exist.
      - ../config:/config
      # Scratch must be on a volume with room for one full-size encode plus
      # headroom. Do not point this at /tmp -- that is RAM on DSM.
      - /volume1/scratch/vidsmasharr:/scratch
      # Media needs write access: the atomic swap replaces files in place.
      # The live library is /volume1/data/media (Anime, movies, music, tv,
      # youtube). Note there is also an unrelated /volume1/Media share -- that
      # is NOT the Plex library; do not point this at it.
      - /volume1/data/media:/media
      # Plex's database, read-only. We copy it before opening, never touch the
      # live file while Plex is running.
      - /volume1/PlexMediaServer/AppData/Plex Media Server/Plug-in Support/Databases:/plexdb:ro

    ports:
      - "8330:8330"

    # Keep it out of Plex's way: the whole point is that the NAS stays usable.
    #
    # NOT `cpus:` -- the DSM kernel has no CFS bandwidth control, so a hard quota
    # fails with "NanoCPUs can not be set". cpu_shares is a relative weight that
    # works here: at 512 against the default 1024, this container yields roughly
    # 2:1 to Plex whenever they compete, while still using the whole CPU when
    # the NAS is otherwise idle. That is the behaviour we actually want for
    # overnight encoding anyway.
    cpu_shares: 512
    mem_limit: 1g
    restart: unless-stopped

    # Default: serve the web UI on :8330 (Overview, Duplicates, Library).
    #
    # One-off runs override this and do not disturb a running container:
    #   docker compose run --rm vidsmasharr bench.capability
    #   docker compose run --rm vidsmasharr bench --libraries /media/tv
    #   docker compose run --rm vidsmasharr app phase1
    #   docker compose run --rm vidsmasharr app scan --probe-limit 500
    #   docker compose run --rm vidsmasharr app status
    command: ["app", "serve"]
