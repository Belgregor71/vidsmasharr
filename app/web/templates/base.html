<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vidsmasharr{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <!-- Progressive enhancement only: every control below is a plain form that
       works if this never loads. -->
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">vidsmasharr</a>
    <nav>
      <a href="/" class="{{ 'on' if nav == '/' }}">Overview</a>
      <a href="/duplicates" class="{{ 'on' if nav.startswith('/duplicates') }}">Duplicates</a>
      <a href="/plan" class="{{ 'on' if nav.startswith('/plan') }}">Plan</a>
      <a href="/review" class="{{ 'on' if nav.startswith('/review') }}">Review</a>
      <a href="/activity" class="{{ 'on' if nav.startswith('/activity') }}">Activity</a>
      <a href="/library" class="{{ 'on' if nav.startswith('/library') }}">Library</a>
    </nav>
    <span class="safety">{{ safety_note }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
